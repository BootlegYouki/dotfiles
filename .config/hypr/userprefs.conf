# English locale for Date and Time (Celsius/Metric)
env = LANG,en_US.UTF-8
env = LC_TIME,en_US.UTF-8
env = LC_MEASUREMENT,en_GB.UTF-8

# ============================================
# WINDOWS-STYLE SHORTCUTS
# ============================================

# Windows + E -> File Manager (Handled by kbFileExplorer in variables.lua / keybinds.lua)
# bind = SUPER, E, exec, nautilus

# Alt + F4 -> Power / Session Menu (Handled by kbSession in variables.lua)

# Ctrl + Shift + Esc -> Task Manager / System Monitor (Handled by kbSystemMonitorWs in variables.lua)
# bind = CTRL SHIFT, Escape, exec, btop

# Windows + V -> Clipboard History Manager (Handled by kbClipboard in variables.lua)
# bind = SUPER, V, exec, caelestia clipboard

# Windows + . -> Emoji Picker (Handled by kbEmoji in variables.lua)
# bind = SUPER, period, exec, caelestia emoji

# Note: Screenshot bindings (SUPER+SHIFT+S and Print) are handled cleanly in keybinds.lua

# Windows + L -> Lock Screen (Handled by kbLock in variables.lua)
# bind = SUPER, L, exec, hyprlock

# Windows + M -> Toggle Floating (Handled by kbToggleWindowFloating in variables.lua)
# Windows + F -> Bordered Fullscreen / Maximized (Handled by kbWindowBorderedFullscreen in variables.lua)
# F11 -> True Fullscreen (Handled by kbWindowFullscreen in variables.lua)
# Windows + K -> Quick Settings / Control Center Panels (Handled by kbSession in variables.lua)

# Windows + Shift + N -> Night Light Toggle (4000K Warm Color Temperature)
bind = SUPER SHIFT, N, exec, nightlight

# Windows + Alt + A -> Startup Applications Manager
bind = SUPER_ALT, A, exec, autostart-manager
